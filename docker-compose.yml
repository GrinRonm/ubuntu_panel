services:
  ubuntu_panel:
    build: .
    container_name: serverdeck
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    volumes:
      - .:/app
      - /etc/nginx:/etc/nginx:rw
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /:/host:rw
    env_file:
      - .env
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin12345}
      - SECRET_KEY=${SECRET_KEY:-serverdeck_secret_2026}
      - PORT=${PORT:-8088}
